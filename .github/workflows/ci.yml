name: CI — TMA Web

on:
  push:
    branches: [main]
    paths:
      - 'app/bot/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/bot/web/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/bot/web/package-lock.json

      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/bot/web/package-lock.json

      - run: npm ci
      - run: npm run build
