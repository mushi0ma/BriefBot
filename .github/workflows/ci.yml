name: CI — TMA Web

on:
  push:
    branches: [main]
    paths:
      - 'app/bot/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/bot/web/**'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/bot/web/package-lock.json

      - run: npm ci
      - run: npm test -- --run

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/bot/web/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Smoke Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/bot/web/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/bot/web/playwright-report/
          retention-days: 7
